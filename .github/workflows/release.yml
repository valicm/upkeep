name: release

# A pushed tag "v1.2.3" becomes the release "upkeep 1.2.3": the four static binaries and
# SHA256SUMS, the file an installer checks its download against.
#   git tag v1.2.3 && git push origin v1.2.3

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -count=1 ./...
      - name: build
        run: scripts/build.sh "$GITHUB_REF_NAME"
      - name: check the binaries
        run: |
          for f in dist/upkeep-linux-amd64 dist/upkeep-linux-arm64 dist/upkeep-linux-armv7 dist/upkeep-freebsd-amd64; do
            file "$f" | grep -q "statically linked" || { echo "$f is not static"; exit 1; }
          done
          said=$(dist/upkeep-linux-amd64 version | head -n1)
          [ "$said" = "${GITHUB_REF_NAME#v} linux/amd64" ] || { echo "the binary says: $said"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "upkeep ${GITHUB_REF_NAME#v}" \
            dist/upkeep-linux-amd64 dist/upkeep-linux-arm64 dist/upkeep-linux-armv7 \
            dist/upkeep-freebsd-amd64 dist/SHA256SUMS
