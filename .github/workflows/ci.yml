name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: |
          go vet ./...
          go vet -tags e2e ./internal/e2e
      - name: go test
        run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "git describe" names the version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross-build
        run: scripts/build.sh
      - name: check the binaries
        run: |
          file dist/upkeep-*
          for f in dist/upkeep-linux-amd64 dist/upkeep-linux-arm64 dist/upkeep-linux-armv7 dist/upkeep-freebsd-amd64; do
            file "$f" | grep -q "statically linked" || { echo "$f is not static"; exit 1; }
          done
          dist/upkeep-linux-amd64 version
      - uses: actions/upload-artifact@v4
        with:
          name: upkeep
          path: dist/
